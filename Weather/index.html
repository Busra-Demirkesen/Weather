<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


<!--Google icons-->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">






</head>
<body>


  <main class="main-container">

    <header class="input-container">
       <input class="city-input" placeholder="Search City">
       <button class="search-btn">
        <span class="material-symbols-outlined">
          search
          </span>

       </button>
    </header>



    <section class="weather-info" style="display: none;">
      <div class="location-date-container">
        <div class="location">
          <span class="material-symbols-outlined">
            location_on
            </span>
            <h4 class="country-txt">Ankara</h4>

        </div>
        <h5 class="current-data-txt regular-txt">
          Wed, 07 Aug
        </h5>
      </div>

        <div class="weather-summary-container">
            <div class="img-weather-summary">
               <img src="assets/cloudy.svg" alt="sun-cloud" class="icon weather-summary-img">
            </div>

            <div class="weather-summary-info">
              <h1 class="temp-txt">29 ℃</h1>
              <h3 class="condition-txt regular-txt">Clouds</h3>
            </div>
        </div>


        <div class="weather-conditions-container">
          <div class="condition-item">
            <span class="material-symbols-outlined">
              water_drop
              </span>
              <div class="condition-info">
                  <h5 class="regular-txt">Humidity</h5>
                  <h5 class="humidity-value-txt">55%</h5>
              </div>
          </div>

          <div class="condition-item"></div>
          <span class="material-symbols-outlined">
            air
            </span>
              <div class="condition-info">
                  <h5 class="regular-txt">Wind speed</h5>
                  <h5 class="wind-value-txt">2 M/s</h5>
              </div>
          </div>
        </div>




        <div class="forecast-items-container">
            <div class="forecast-item">
              <h5 class="forecast-item-date regular-txt">05 Aug</h5>
              <img src="assets/storm.svg" alt="storm-cloud" class="forecast-item-img ">
              <h5 class="forecast-item-temp">29 ℃</h5>
            </div>

            <div class="forecast-item">
              <h5 class="forecast-item-date regular-txt">05 Aug</h5>
              <img src="assets/storm.svg" alt="storm-cloud" class="forecast-item-img ">
              <h5 class="forecast-item-temp">29 ℃</h5>
            </div>


            <div class="forecast-item">
              <h5 class="forecast-item-date regular-txt">05 Aug</h5>
              <img src="assets/storm.svg" alt="storm-cloud" class="forecast-item-img ">
              <h5 class="forecast-item-temp">29 ℃</h5>
            </div>


            <div class="forecast-item">
              <h5 class="forecast-item-date regular-txt">05 Aug</h5>
              <img src="assets/storm.svg" alt="storm-cloud" class="forecast-item-img">
              <h5 class="forecast-item-temp">29 ℃</h5>
            </div>
            

            
        </div>
    </section>



<section class="search-city section-message">
  <img src="assets/message/exploration.svg">
  <div>
    <h1>Search City</h1>
    <h4 class="regular-txt">
      Find out the weather condition of the city
    </h4>
  </div>

</section>

<section class="not-found section-message" style="display: none;">
  <img src="assets/message/no-found.svg">
  <div>
     <h1>Search City</h1>
     <h4 class="regular-txt">
        Find out the weather condition of the city
     </h4>
  </div>
</section>




  </main>







  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
